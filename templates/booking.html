<!DOCTYPE html>
<html>
<head>
    
    <title>Book service</title>
<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:  ghostwhite;
}
.container{
    width: 400px;
    margin: 100px auto;
    background: rgb(241, 206, 211);
    padding: 30px;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
}
input, textarea, select{
    width: 90%;
    padding: 7px;
    margin: 10px;
    margin-bottom: 15px;
}
button{
    background: rgb(120, 188, 18);
    color: white;
    padding: 9px;
    border: none;
    width: 100%;
    cursor: pointer;
    border-radius: 5px;
}
.error{
    color: red;
}
</style>   
</head>
<body>
    <div class="container">
        <h2>Book service</h2>
        <form method="post">
            
            <label>Date</label>
            <input type="date" name="date" value="{{date}}" required>
            {% if date_error %}
            <p class="error">{{date_error}}</p>
            {% endif %}

            <label>Time Slot</label>
            <select name="time"  required>
                <option value="">Select Time</option>
                {% for slot in slots %}
                      <option value="{{slot}}" {% if time == slot %} selected {% endif %}>{{slot}}</option>
                {% endfor  %}
            </select>
            {% if time_error %}
            <p class="error">{{time_error}}</p>
            {% endif %}

            <lable> City</lable>
            <textarea name="city" required></textarea>
            {% if city_error %}
            <p class="error">{{city_error}}</p>
            {% endif %}

            <div class="input-group">
            <label>Zone :</label>
            <select name="zone_id" >
                <option value="">Select Zone</option>
                {% for zone in zones %}
                  <option value="{{zone.zone_id}}" {% if zone.zone_id == zone_id %}selected{% endif %}>
                    {{zone.zone_name}}
                   </option>
                {% endfor %}
            </select>
        </div>
            
            <label>Address</label>
            <textarea name="address" required></textarea>
            {% if address_error %}
            <p class="error">{{address_error}}</p>
            {% endif %}

            <input type="hidden" name="service_id" value="{{service_id}}">
            <button type="submit"> Confirm Booking</button>
        </form>
    </div>
</body>
</html>
