<!DOCTYPE html>
<html>
<head>
    <title>check reviews</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='view.css') }}">


</head>
<body>
     <div class="sidebar">
        <h2>User Panel</h2>
        <a href="/dashboard">Dashboard</a>
        <a href="/my_bookings">My Bookings</a>
        <a href="#">Payment History</a>
        <a href="#">Chat</a>
        <a href="/notifications">🔔Notification({{ notification_count }})</a>
        <a href="/customer/profile">Profile</a>
        <a href="/logout">Logout</a>
    </div> 
    
     
    <div class="booking-card">

    <h2> provider reviews</h2>

    <div class="section-title">Reviews Info</div>
    {% for r in reviews %}
    <div class="info"><b>Booking Date:</b> <span>{{ r.booking_date }}</span></div>
    <div class="info"><b>Customer:</b> <span>{{ r.customer_name }}</span></div>
    <div class="info"><b>Rating:</b> <span>{{ r.rating }}</span></div>
    <div class="info"><b>Review:</b> <span>{{ r.review }}</span></div>
    <hr>
    {% endfor %}
</div>

</body>
  
</html>
